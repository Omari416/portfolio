<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" fill="none" role="img" aria-label="Launch is just the start">
  <defs>
    <pattern id="launch-grid" width="24" height="24" x="8" y="12" patternUnits="userSpaceOnUse">
      <path d="M0 0h24M0 0v24" stroke="#ffffff" stroke-opacity=".03" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="launch-glow">
      <stop stop-color="#ef4a2b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ef4a2b" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes launch-pulse {
        0%, 100% { opacity: .55; transform: scale(.72); }
        50% { opacity: 1; transform: scale(1.18); }
      }
      @media (prefers-reduced-motion: no-preference) {
        .launch-halo { transform-origin: 456px 101px; animation: launch-pulse 2.8s ease-in-out infinite; }
      }
    </style>
    <rect id="launch-stage" width="80" height="56" rx="12" stroke="#f2f2f2"/>
    <path id="launch-arrow" d="M0 0h22m-5-5 5 5-5 5"/>
    <g id="launch-blade">
      <rect width="106" height="23" rx="8" stroke="#f2f2f2"/>
      <path d="M12 11.5h26m6 0h8" stroke="#3d3d3d"/>
      <circle cx="79" cy="11.5" r="1.8" stroke="#3d3d3d"/>
      <circle cx="91" cy="11.5" r="1.8" fill="#f2f2f2"/>
    </g>
  </defs>

  <rect width="640" height="360" fill="url(#launch-grid)"/>
  <g stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="171" y="49" width="310" height="114" rx="14" stroke="#f2f2f2"/>
    <path d="M171 76h310m-289-13h37" stroke="#3d3d3d"/>
    <path d="M194 96v47h264m-264-14h264m-264-16h264m-219-17v47m44-47v47m44-47v47m44-47v47m44-47v47" stroke="#2c2c2c"/>
    <path d="m194 127 23-4 20 2 24-7 21 2 22-6 22 3 22-7 21 2 23-6 20 3 22-5 22-3" stroke="#f2f2f2"/>
    <circle class="launch-halo" cx="456" cy="101" r="24" fill="url(#launch-glow)"/>
    <circle cx="456" cy="101" r="4" fill="#ef4a2b"/>

    <use href="#launch-stage" x="78" y="201"/>
    <use href="#launch-stage" x="201" y="201"/>
    <use href="#launch-stage" x="324" y="201"/>
    <g stroke="#3d3d3d">
      <path d="M95 223h45m-45 12h27m96-12h34m-34 12h45m78-12h42m-42 12h23"/>
      <use href="#launch-arrow" x="168" y="229"/>
      <use href="#launch-arrow" x="291" y="229"/>
      <use href="#launch-arrow" x="414" y="229"/>
    </g>
    <use href="#launch-blade" x="447" y="188.5"/>
    <use href="#launch-blade" x="447" y="217.5"/>
    <use href="#launch-blade" x="447" y="246.5"/>

    <path d="M500 277c0 30-44 40-90 40H219c-55 0-89-14-101-53" stroke="#3d3d3d" stroke-dasharray="4 6"/>
    <path d="m114 271 4-7 7 4" stroke="#3d3d3d"/>
  </g>
</svg>
