<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" fill="none" role="img" aria-label="Slice to ship early">
  <defs>
    <pattern id="ship-grid" width="24" height="24" x="8" y="12" patternUnits="userSpaceOnUse">
      <path d="M0 0h24M0 0v24" stroke="#fff" stroke-opacity=".03" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="ship-glow">
      <stop stop-color="#ef4a2b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ef4a2b" stop-opacity="0"/>
    </radialGradient>
    <g id="ship-card">
      <rect width="92" height="36" rx="8"/>
      <path d="M11 12h37" stroke="#3d3d3d"/>
    </g>
    <path id="ship-segment" d="M0 0h8"/>
    <g id="ship-priority-two">
      <use href="#ship-segment"/>
      <use href="#ship-segment" x="12"/>
    </g>
    <g id="ship-priority-three">
      <use href="#ship-priority-two"/>
      <use href="#ship-segment" x="24"/>
    </g>
    <rect id="ship-column" width="116" height="252" rx="14"/>
  </defs>

  <rect width="640" height="360" fill="url(#ship-grid)"/>
  <g stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#2c2c2c">
      <use href="#ship-column" x="127" y="55"/>
      <use href="#ship-column" x="262" y="55"/>
      <use href="#ship-column" x="397" y="55"/>
    </g>
    <path d="M141 70h22m113 0h22m113 0h22" stroke="#3d3d3d"/>

    <g stroke="#f2f2f2">
      <use href="#ship-card" x="139" y="132"/>
      <use href="#ship-card" x="274" y="86"/>
      <use href="#ship-card" x="274" y="132"/>
      <use href="#ship-card" x="409" y="86"/>
    </g>
    <g stroke="#3d3d3d">
      <use href="#ship-card" x="139" y="202"/>
      <use href="#ship-card" x="139" y="248"/>
      <use href="#ship-card" x="274" y="202"/>
      <use href="#ship-card" x="409" y="202"/>
      <use href="#ship-card" x="409" y="248"/>
      <use href="#ship-priority-two" x="150" y="156"/>
      <use href="#ship-priority-three" x="285" y="110"/>
      <use href="#ship-segment" x="285" y="156"/>
      <use href="#ship-priority-two" x="420" y="110"/>
      <use href="#ship-segment" x="150" y="226"/>
      <use href="#ship-priority-two" x="150" y="272"/>
      <use href="#ship-segment" x="285" y="226"/>
      <use href="#ship-priority-three" x="420" y="226"/>
      <use href="#ship-segment" x="420" y="272"/>
    </g>

    <path d="M103 184h433" stroke="#f2f2f2" stroke-opacity=".55" stroke-dasharray="4 6"/>
    <path d="M540 184v-24h18l-5 6 5 6h-18" stroke="#f2f2f2"/>
    <circle cx="540" cy="184" r="2" fill="#f2f2f2"/>

    <rect x="139" y="86" width="92" height="36" rx="8" stroke="#2c2c2c" stroke-dasharray="3 5"/>
    <g transform="rotate(-7 173 91)">
      <ellipse cx="173" cy="91" rx="68" ry="43" fill="url(#ship-glow)"/>
      <use href="#ship-card" x="127" y="73" stroke="#ef4a2b"/>
      <use href="#ship-priority-three" x="138" y="97" stroke="#3d3d3d"/>
    </g>
  </g>
</svg>
