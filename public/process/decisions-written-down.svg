<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" fill="none" role="img" aria-label="Decisions written down">
  <defs>
    <pattern id="decisions-grid" width="24" height="24" x="8" y="12" patternUnits="userSpaceOnUse">
      <path d="M0 0h24M0 0v24" stroke="#ffffff" stroke-opacity=".03" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="decisions-glow">
      <stop stop-color="#ef4a2b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ef4a2b" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes decisions-travel {
        from { transform: translateX(-37px); }
        to { transform: translateX(37px); }
      }
      @media (prefers-reduced-motion: no-preference) {
        .decisions-dot { animation: decisions-travel 2.8s linear infinite; }
      }
    </style>
  </defs>
  <rect width="640" height="360" fill="url(#decisions-grid)"/>
  <g stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Database -->
    <g stroke="#f2f2f2">
      <ellipse cx="135" cy="144" rx="38" ry="12"/>
      <path d="M97 144v53c0 6.6 17 12 38 12s38-5.4 38-12v-53"/>
    </g>
    <path d="M97 162c0 6.6 17 12 38 12s38-5.4 38-12m-76 18c0 6.6 17 12 38 12s38-5.4 38-12" stroke="#3d3d3d"/>

    <!-- API and security -->
    <path d="M259 170l22-36q3-5 9-5h42q6 0 9 5l22 36q3 5 0 10l-22 36q-3 5-9 5h-42q-6 0-9-5l-22-36q-3-5 0-10Z" stroke="#f2f2f2"/>
    <path d="M272 175l18-32h42l18 32-18 32h-42z" stroke="#2c2c2c"/>
    <g stroke="#f2f2f2">
      <rect x="299" y="170" width="24" height="19" rx="5"/>
      <path d="M304 170v-6a7 7 0 0 1 14 0v6m-7 8v4"/>
    </g>

    <!-- Clients and connections -->
    <path d="M365 175h50m0-4v-51q0-8 8-8h46m-54 67v51q0 8 8 8h46" stroke="#3d3d3d"/>
    <g stroke="#3d3d3d">
      <circle cx="415" cy="175" r="4"/>
      <circle cx="472" cy="112" r="3"/>
      <circle cx="472" cy="238" r="3"/>
    </g>
    <g stroke="#f2f2f2">
      <rect x="475" y="64" width="50" height="96" rx="10"/>
      <rect x="475" y="200" width="100" height="76" rx="10"/>
    </g>
    <g stroke="#3d3d3d">
      <path d="M496 73h8m-11 77h14M475 219h100m-88 39h42m-42 8h28"/>
      <rect x="486" y="88" width="28" height="30" rx="8"/>
      <path d="M488 130h24m-24 7h16"/>
      <rect x="487" y="228" width="76" height="22" rx="8" stroke="#2c2c2c"/>
      <path d="M497 239h27m9 0h19"/>
      <circle cx="487" cy="210" r="1.5"/>
      <circle cx="494" cy="210" r="1.5"/>
      <circle cx="501" cy="210" r="1.5"/>
    </g>

    <!-- Folded decision record -->
    <g stroke="#3d3d3d">
      <path d="M97 244h24l16 16v30a8 8 0 0 1-8 8H97a8 8 0 0 1-8-8v-38a8 8 0 0 1 8-8Z"/>
      <path d="M121 244v10a6 6 0 0 0 6 6h10m-38 8h26m-26 8h22m-22 8h16"/>
    </g>

    <!-- Highlighted database link -->
    <ellipse cx="215" cy="175" rx="58" ry="20" fill="url(#decisions-glow)"/>
    <path d="M173 175h84" stroke="#ef4a2b"/>
    <circle class="decisions-dot" cx="215" cy="175" r="3.5" fill="#ef4a2b"/>
  </g>
</svg>
